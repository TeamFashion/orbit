<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>เช็คราคาเครื่อง · OPPO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1012;
    --bg-soft:#15181B;
    --card:#1A1E21;
    --card-2:#20252A;
    --line:rgba(255,255,255,0.08);
    --accent:#17D08A;
    --accent-dim:rgba(23,208,138,0.14);
    --accent-2:#3AA0FF;
    --text:#EDEFEF;
    --text-dim:#9AA3A8;
    --text-faint:#6B7377;
    --warn:#F5A524;
    --danger:#F1495B;
    --danger-dim:rgba(241,73,91,0.12);
    --danger-line:rgba(241,73,91,0.35);
    --display:'Space Grotesk',sans-serif;
    --body:'Inter',sans-serif;
    --mono:'JetBrains Mono',monospace;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--body);}
  body{padding-bottom:calc(24px + env(safe-area-inset-bottom));}

  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 75%,rgba(14,16,18,0));backdrop-filter:blur(6px);padding:16px 14px 10px;}
  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .brand h1{font-family:var(--display);font-size:19px;font-weight:700;margin:0;letter-spacing:-0.02em;}
  .brand h1 span{color:var(--accent);}
  .brand .sub{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);}
  .credit{font-size:10px;color:var(--text-faint);margin-top:1px;}
  .search-wrap{position:relative;}
  .search-wrap input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);padding:11px 14px 11px 38px;border-radius:12px;font-size:14px;font-family:var(--body);outline:none;}
  .search-wrap input:focus{border-color:var(--accent);}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text-faint);}

  .tabs{display:flex;gap:5px;margin-top:12px;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--line);}
  .tab{flex:1;text-align:center;padding:9px 2px;border-radius:9px;font-size:11.5px;font-weight:600;color:var(--text-dim);cursor:pointer;transition:.15s;position:relative;white-space:nowrap;}
  .tab.active{background:var(--accent);color:#06231A;}
  .tab .cnt{position:absolute;top:2px;right:6px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .tab.active .cnt{background:#fff;color:var(--danger);}

  main{padding:14px 14px 20px;max-width:640px;margin:0 auto;}
  .view{display:none;}
  .view.active{display:block;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .empty{text-align:center;padding:50px 20px;color:var(--text-faint);font-size:13px;}
  .empty b{display:block;color:var(--text-dim);font-family:var(--display);font-size:15px;margin-bottom:6px;font-weight:600;}

  .subtabs{display:flex;gap:6px;margin-bottom:14px;}
  .subtab{flex:1;text-align:center;white-space:nowrap;padding:9px 6px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--text-dim);cursor:pointer;font-family:var(--display);}
  .subtab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

  .discount-sim{margin-top:12px;padding:12px 14px;background:var(--card-2);border:1px dashed var(--line);border-radius:12px;}
  .ds-label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .ds-row{display:flex;gap:8px;align-items:center;}
  .ds-row input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:9px;font-size:14px;font-family:var(--mono);outline:none;min-width:0;}
  .ds-row input:focus{border-color:var(--accent);}
  .ds-clear{padding:9px 14px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--text-dim);font-size:12.5px;font-weight:700;cursor:pointer;flex-shrink:0;}
  .ds-breakdown{margin-top:10px;font-size:12px;color:var(--text-dim);}
  .ds-breakdown .ds-line{display:flex;justify-content:space-between;padding:2px 0;}
  .ds-final{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;}
  .ds-final b{font-family:var(--mono);font-size:18px;color:var(--accent);}

  /* ---- price card ---- */
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
  .mcard.out{border-color:var(--danger-line);background:linear-gradient(180deg,var(--danger-dim),var(--card) 40%);}
  .mcard-head{padding:14px 15px;cursor:pointer;}
  .mline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:-0.01em;}
  .mline .nm{color:var(--text);}
  .mline .spec{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text-dim);background:var(--card-2);padding:2px 7px;border-radius:6px;}
  .mcard-sub{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;}
  .price-block .p1{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--accent);}
  .price-block .p0{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);text-decoration:line-through;}
  .price-block .lbl{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;}
  .out-badge{display:inline-flex;align-items:center;gap:4px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:7px;}
  .chev{width:15px;height:15px;stroke:var(--text-faint);transition:.2s;flex-shrink:0;}
  .mcard.open .chev{transform:rotate(180deg);}
  .head-right{display:flex;align-items:center;gap:8px;}

  .mcard-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .mcard.open .mcard-body{border-top:1px solid var(--line);}
  .mcard-inner{padding:13px 15px 15px;}
  .row-line{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:var(--text-dim);}
  .row-line b{color:var(--text);font-family:var(--mono);}

  .stock-label{font-size:10.5px;color:var(--text-faint);margin:10px 0 7px;text-transform:uppercase;letter-spacing:.04em;}
  .code-list{display:flex;flex-direction:column;gap:6px;}

  .ladder-label{font-size:10.5px;color:var(--text-faint);margin:12px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:6px 10px;border-radius:8px;background:var(--card-2);border:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--text-dim);cursor:pointer;}
  .chip.sel{background:var(--accent);color:#06231A;border-color:var(--accent);font-weight:700;}
  .ladder-result{margin-top:12px;padding:12px 14px;background:var(--accent-dim);border:1px solid rgba(23,208,138,0.3);border-radius:12px;}
  .ladder-result .lr-price{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--accent);}
  .ladder-result .lr-bar{margin-top:8px;height:5px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden;}
  .ladder-result .lr-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease;}
  .ladder-result .lr-save{font-size:11px;color:var(--text-faint);margin-top:6px;font-family:var(--mono);}
  .code-chip{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:9px;background:var(--card-2);border:1px solid var(--line);}
  .code-chip.zero{background:var(--danger-dim);border-color:var(--danger-line);}
  .code-chip .cc-left{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .code-chip .cc-left .dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.25);flex-shrink:0;}
  .code-chip .cc-code{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);}
  .code-chip.zero .cc-code, .code-chip.zero .cc-color{color:var(--danger);font-weight:700;}
  .code-chip .cc-qty{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text-dim);}
  .code-chip.zero .cc-qty{color:var(--danger);}
  .cc-days{font-size:10px;color:var(--danger);font-family:var(--mono);}

  /* ---- manage view ---- */
  .add-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;background:var(--accent);color:#06231A;border:none;border-radius:12px;font-weight:700;font-size:14px;font-family:var(--body);cursor:pointer;margin-bottom:14px;}
  .add-btn svg{width:16px;height:16px;stroke:#06231A;stroke-width:2.5;}
  .mi-sub{font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-top:2px;}
  .icon-btn{width:34px;height:34px;border-radius:9px;background:var(--card-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .icon-btn svg{width:15px;height:15px;stroke:var(--text-dim);}
  .icon-btn.danger svg{stroke:var(--danger);}

  /* ---- stock/code view ---- */
  .stock-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;}
  .stock-card.out{border-color:var(--danger-line);}
  .drag-item{transition:box-shadow .15s ease, transform .15s ease;}
  .drag-item.dragging{box-shadow:0 14px 28px rgba(0,0,0,0.5);transform:scale(1.02) translateY(-3px);z-index:50;position:relative;}
  .drag-item.dragging .stock-card{border-color:var(--accent);}
  .drag-handle{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-faint);touch-action:none;cursor:grab;border-radius:8px;}
  .drag-handle:active{cursor:grabbing;background:var(--card-2);}
  .drag-handle svg{width:16px;height:16px;}
  .drag-handle.disabled{opacity:.25;pointer-events:none;}
  .stock-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;}
  .stock-card-head .sc-name{font-family:var(--display);font-weight:600;font-size:14px;}
  .stock-card-head .sc-name .sc-spec{color:var(--text-faint);font-weight:400;font-size:11.5px;font-family:var(--mono);margin-left:5px;}
  .stock-total{font-family:var(--mono);font-size:11px;color:var(--text-dim);background:var(--card-2);padding:3px 9px;border-radius:7px;white-space:nowrap;}
  .stock-total.out{color:var(--danger);background:var(--danger-dim);}
  .color-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);gap:8px;}
  .color-row:first-of-type{border-top:none;}
  .color-row.zero{background:var(--danger-dim);margin:0 -14px;padding:9px 14px;border-top:1px solid var(--danger-line);}
  .color-info{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .color-name{font-size:13px;color:var(--text);display:flex;align-items:center;gap:7px;}
  .color-row.zero .color-name{color:var(--danger);font-weight:700;}
  .dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.25);flex-shrink:0;}
  .code-tag{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);}
  .color-row.zero .code-tag{color:var(--danger);}
  .days-tag{font-size:10px;color:var(--danger);font-family:var(--mono);}
  .qty-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .qty-ctrl button{width:26px;height:26px;border-radius:7px;background:var(--card-2);border:1px solid var(--line);color:var(--text);font-size:15px;cursor:pointer;line-height:1;}
  .qty-ctrl .qn{font-family:var(--mono);font-weight:700;min-width:20px;text-align:center;font-size:13.5px;}
  .qty-ctrl .qn.zero{color:var(--danger);}
  .row-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.55;flex-shrink:0;}
  .row-icon svg{width:13px;height:13px;stroke:var(--text-faint);}
  .add-color-btn{margin-top:10px;width:100%;padding:9px;border:1px dashed var(--line);background:transparent;color:var(--text-dim);border-radius:9px;font-size:12.5px;cursor:pointer;font-family:var(--body);}

  /* ---- out of stock summary ---- */
  .oos-summary-top{background:var(--danger-dim);border:1px solid var(--danger-line);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
  .oos-summary-top .big{font-family:var(--display);font-size:26px;font-weight:700;color:var(--danger);}
  .oos-summary-top .cap{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .oos-group{margin-bottom:12px;}
  .oos-group-title{font-family:var(--display);font-weight:600;font-size:13.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .oos-group-title .fullout{background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;}
  .oos-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--danger-line);border-radius:10px;padding:9px 12px;margin-bottom:6px;}
  .oos-row .oos-left{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .oos-row .oos-code{font-family:var(--mono);font-size:11px;color:var(--text-faint);}
  .oos-row .oos-days{font-family:var(--mono);font-size:11px;color:var(--danger);font-weight:700;white-space:nowrap;}

  /* ---- modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(6,8,9,0.72);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-end;justify-content:center;}

  /* ---- lock screen ---- */
  body.locked .topbar, body.locked main{display:none;}
  .lock-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;}
  .lock-card{width:100%;max-width:340px;text-align:center;}
  .lock-card .lock-icon{width:52px;height:52px;border-radius:16px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .lock-card .lock-icon svg{width:24px;height:24px;stroke:var(--accent);}
  .lock-card h1{font-family:var(--display);font-size:20px;font-weight:700;margin:0 0 4px;}
  .lock-card h1 span{color:var(--accent);}
  .lock-card .lock-sub{font-size:12.5px;color:var(--text-faint);margin-bottom:22px;}
  .lock-card input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:12px;font-size:16px;font-family:var(--mono);text-align:center;letter-spacing:.15em;outline:none;margin-bottom:10px;}
  .lock-card input:focus{border-color:var(--accent);}
  .lock-card .lock-btn{width:100%;padding:13px;background:var(--accent);color:#06231A;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;}
  .lock-card .lock-err{color:var(--danger);font-size:12px;margin-top:10px;min-height:16px;}
  .lock-card.shake{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  .lock-foot{font-size:10.5px;color:var(--text-faint);margin-top:20px;}
  .lock-links{display:flex;justify-content:center;gap:6px;margin-top:6px;}
  .header-lock-btn{width:30px;height:30px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .header-lock-btn svg{width:14px;height:14px;stroke:var(--text-faint);}
  .overlay.show{display:flex;}
  .modal{background:var(--bg-soft);border:1px solid var(--line);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:20px 18px 26px;animation:slideup .22s ease;}
  @keyframes slideup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .modal-handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px;}
  .modal h2{font-family:var(--display);font-size:17px;margin:0 0 16px;font-weight:700;}
  .field{margin-bottom:12px;}
  .field label{font-size:11px;color:var(--text-faint);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;font-size:14px;font-family:var(--body);outline:none;}
  .field input:focus{border-color:var(--accent);}
  .field select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;font-size:14px;font-family:var(--body);outline:none;}
  .field select:focus{border-color:var(--accent);}
  .field .hint{font-size:10.5px;color:var(--text-faint);margin-top:4px;}
  .field-row{display:flex;gap:8px;}
  .field-row .field{flex:1;}
  .tier-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .tier-row input{flex:1;}
  .tier-row .rm{width:34px;height:34px;flex-shrink:0;border-radius:9px;background:var(--card-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .tier-row .rm svg{width:13px;height:13px;stroke:var(--danger);}
  .add-tier{padding:8px 12px;border:1px dashed var(--line);background:transparent;color:var(--text-dim);border-radius:9px;font-size:12.5px;cursor:pointer;width:100%;margin-bottom:14px;}
  .section-note{font-size:10.5px;color:var(--text-faint);margin:14px 0 8px;}
  .modal-actions{display:flex;gap:8px;margin-top:6px;}
  .btn{flex:1;padding:12px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;border:none;font-family:var(--body);}
  .btn.primary{background:var(--accent);color:#06231A;}
  .btn.ghost{background:var(--card-2);color:var(--text-dim);border:1px solid var(--line);}
  .btn.danger{background:rgba(241,73,91,.14);color:var(--danger);border:1px solid rgba(241,73,91,.3);}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--card-2);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:10px;font-size:12.5px;z-index:200;opacity:0;transition:.2s;pointer-events:none;max-width:85%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .undo-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--card-2);border:1px solid var(--line);color:var(--text);padding:10px 10px 10px 16px;border-radius:10px;font-size:12.5px;z-index:200;opacity:0;transition:.2s;max-width:90%;display:flex;align-items:center;gap:10px;pointer-events:none;}
  .undo-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .undo-toast .ut-msg{flex:1;}
  .undo-toast .ut-btn{background:var(--accent);color:#06231A;border:none;padding:7px 12px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
</style>
</head>
<body class="locked">

<div class="lock-screen" id="lockScreen"></div>

<div class="topbar">
  <div class="brand">
    <div>
      <h1>Project <span>ORBIT</span></h1>
      <div class="credit">Made with ❤️ by Tora</div>
    </div>
    <div style="display:flex;align-items:flex-start;gap:8px;">
      <div style="text-align:right;">
        <div class="sub" id="updatedAt"></div>
        <div class="sub" id="totalStockSummary" style="margin-top:2px;"></div>
      </div>
      <div class="header-lock-btn" onclick="openChangePasscodeModal()" title="เปลี่ยนรหัสผ่าน / ล็อกแอป">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
    </div>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

/* ============ ACCESS LOCK (PIN gate + 24h session) ============

   Everything runs in the browser with no backend, so a technically determined
   person could still bypass it via dev tools or view-source. It stops someone
   who just has the link/file from casually opening it, which is the actual
   threat this was built for. Real protection requires a server-side check

function showUndoToast(message, undoFn){
  pendingUndo = { undo: undoFn };

function performUndo(){
  if(pendingUndo && pendingUndo.undo) pendingUndo.undo();
  pendingUndo = null;
  clearTimeout(window._undoTimer);
  document.getElementById('undoToast').classList.remove('show');
}
function totalStockAll(){
  let total = 0;
  Object.values(stock).forEach(arr => arr.forEach(c => total += Number(c.qty||0)));
  return total;
}

  const el = document.getElementById('totalStockSummary');

function stampUpdated(){
  // writes a shared server timestamp so every connected device sees the same
  // "last updated" time, not just whichever device made the change
  db.ref('meta/lastUpdated').set(firebase.database.ServerValue.TIMESTAMP);
}
function renderLastUpdated(ts){
  const el = document.getElementById('updatedAt');
  if(!el) return;
  el.textContent = ts ? 'อัปเดตล่าสุด ' + new Date(ts).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}) : '';
}
function specLine(m){
  if(m.isKit) return m.kitLabel;
  const r = String(m.ram||'').replace(/GB$/i,'');
  const s = String(m.storage||'').replace(/GB$/i,'');
  if(!r && !s) return '';
  const isTb = /TB$/i.test(m.storage||'');
  return isTb ? `${r}/${s}` : `${r}/${s}GB`;
}
function isIot(m){ return (m.series||'a') === 'iot'; }
function hasPrice(m){ return Number(m.normal||0) > 0 || Number(m.special||0) > 0; }
function daysOutText(iso){
  if(!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const d = Math.floor(diff / 86400000);
  return d <= 0 ? 'หมดวันนี้' : `หมดมา ${d} วัน`;
}
function daysOutNum(iso){
  if(!iso) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000));
}
function modelStockInfo(id){
  const arr = stock[id] || [];
  const total = arr.reduce((a,c)=>a+Number(c.qty||0),0);
  const hasRecords = arr.length > 0;
  const allZero = hasRecords && arr.every(c=>Number(c.qty||0)===0);
  let since = null;
  if(allZero){
    since = arr.reduce((max,c)=> (!c.outSince ? max : (!max || c.outSince > max ? c.outSince : max)), null);
  }
  return {total, hasRecords, out: allZero, since};
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function filterModels(){
  let list = models.filter(m => (m.series||'a') === currentSeries);
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q) return list;
  return list.filter(m=>{
    if((m.name+' '+specLine(m)).toLowerCase().includes(q)) return true;
    const codes = (stock[m.id]||[]).map(c=>c.code+' '+c.color).join(' ').toLowerCase();
    return codes.includes(q);
  });
}
function subtabsHtml(){
  return `<div class="subtabs">${SERIES_LIST.map(s=>
    `<div class="subtab ${s.id===currentSeries?'active':''}" onclick="switchSeries('${s.id}')">${s.label}</div>`
  ).join('')}</div>`;
}
function switchSeries(series){
  currentSeries = series;
  renderAll();
}
const swatchMap = {'ดำ':'#222','black':'#222','ขาว':'#eee','white':'#eee','เขียว':'#2e7d32','green':'#2e7d32',
  'ฟ้า':'#3aa0ff','น้ำเงิน':'#2255cc','blue':'#2255cc','ทอง':'#c9a227','gold':'#c9a227','ชมพู':'#e07ba0','pink':'#e07ba0',
  'ม่วง':'#7a5cc0','purple':'#7a5cc0','เทา':'#8a8f94','gray':'#8a8f94','grey':'#8a8f94','แดง':'#d0413f','red':'#d0413f',
  'ส้ม':'#e08a3a','orange':'#e08a3a','น้ำตาล':'#7a5230','brown':'#7a5230'};
function colorSwatch(name){
  const key = (name||'').trim().toLowerCase();
  for(const k in swatchMap){ if(key.includes(k)) return swatchMap[k]; }
  return '#555a5f';
}

/* ============ TABS ============ */
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  renderAll();
}
function renderAll(){
  updateOosBadge();
  updateHeaderSummary();
  if(currentTab==='price') renderPriceView();
  if(currentTab==='manage') renderManageView();
  if(currentTab==='oos') renderOosView();
}
function updateOosBadge(){
  let count = 0;
  models.forEach(m=>{
    (stock[m.id]||[]).forEach(c=>{ if(Number(c.qty||0)===0) count++; });
  });
  const el = document.getElementById('oosCount');
  if(count>0){ el.style.display='flex'; el.textContent = count; } else { el.style.display='none'; }
}

/* ============ PRICE VIEW ============ */
function renderPriceView(){
  const list = filterModels();
  const el = document.getElementById('view-price');
  const searchActive = document.getElementById('searchInput').value.trim() !== '';
  let html = subtabsHtml();
  if(list.length===0){
    html += searchActive
      ? emptyHtml('ไม่พบรุ่นนี้', 'ลองค้นหาด้วยชื่อรุ่นหรือรหัสสินค้าอื่น', true)
      : emptyHtml('ยังไม่มีรุ่นในหมวดนี้', 'เพิ่มรุ่นได้ที่แท็บ "จัดการรุ่น/สต๊อก"');
    el.innerHTML = html; return;
  }
  html += list.map(m => isIot(m) ? iotCardHtml(m) : modelCardHtml(m)).join('');
  el.innerHTML = html;
}
function emptyHtml(title, sub, showClear){
  return `<div class="empty"><b>${title}</b>${sub}${showClear ? `<div><button class="add-tier" style="margin-top:14px;max-width:220px;margin-left:auto;margin-right:auto;" onclick="clearSearch()">ล้างการค้นหา</button></div>` : ''}</div>`;
}
function clearSearch(){
  document.getElementById('searchInput').value = '';
  renderAll();
}

function priceBlockHtml(m){
  if(!hasPrice(m)){
    return `<div class="lbl">ราคา</div><div class="p1" style="color:var(--text-faint);">ยังไม่ระบุราคา</div>`;
  }
  return `<div class="lbl">เครื่องเปล่าราคาพิเศษ</div><div class="p1">${fmt(m.special)} บ.</div><div class="p0">ปกติ ${fmt(m.normal)} บ.</div>`;
}

function codeChipsHtml(m){
  const codes = stock[m.id] || [];
  const chips = codes.map(c=>{
    const zero = Number(c.qty||0)===0;
    return `<div class="code-chip ${zero?'zero':''}">
      <div class="cc-left">
        <span class="dot" style="background:${colorSwatch(c.color)}"></span>
        <span class="cc-color">${escapeHtml(c.color)}</span>
        <span class="cc-code">#${escapeHtml(c.code)}</span>
      </div>
      <div style="text-align:right;">
        <div class="cc-qty">${c.qty} ชิ้น</div>
        ${zero ? `<div class="cc-days">${daysOutText(c.outSince)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
  return { codes, chips };
}

// Discount simulator: lets staff preview a price after an ad-hoc extra discount,
// to show the customer. Works against whichever tier is currently selected in the
// "ลูกค้าเบอร์รายเดือน" ladder if the model has installment plans, or against the
// cash special price otherwise. Not saved/exported — it's an in-session calculator
// only, reset with the Clear button.
function cashBreakdownHtml(m){
  const disc = Number(discountSimCash[m.id]||0);
  const final = Math.max(0, m.special - disc);
  return `
    <div class="ds-line"><span>ราคาเครื่องเปล่าพิเศษ</span><span>${fmt(m.special)} บาท</span></div>
    ${disc>0 ? `<div class="ds-line" style="color:var(--danger);"><span>ส่วนลดเพิ่มเติม</span><span>− ${fmt(disc)} บาท</span></div>` : ''}
    <div class="ds-final"><span>ราคาที่ลูกค้าจ่าย (ตัวอย่าง)</span><b>${fmt(final)} บาท</b></div>`;
}
function cashDiscountSimHtml(m){
  if(!hasPrice(m)) return '';
  const disc = Number(discountSimCash[m.id]||0);
  return `
  <div class="discount-sim" onclick="event.stopPropagation();">
    <div class="ds-label">จำลองส่วนลดเพิ่มเติม (เครื่องเปล่าราคาพิเศษ)</div>
    <div class="ds-row">
      <input id="ds-input-cash-${m.id}" type="number" min="0" placeholder="ใส่ส่วนลดเพิ่ม (บาท)" value="${disc||''}" oninput="applyDiscountSim('cash','${m.id}', this.value)">
      <button class="ds-clear" onclick="clearDiscountSim('cash','${m.id}')">Clear</button>
    </div>
    <div class="ds-breakdown" id="ds-breakdown-cash-${m.id}">${cashBreakdownHtml(m)}</div>
  </div>`;
}

function tierBreakdownHtml(m){
  const sel = selectedTier[m.id] ?? 0;
  const t = m.tiers[sel];
  const disc = Number(discountSimTier[m.id]||0);
  const final = Math.max(0, t.p - disc);
  return `
    <div class="ds-line"><span>ราคาโปรผ่อนเดือนละ ${t.m} บาท</span><span>${fmt(t.p)} บาท</span></div>
    ${disc>0 ? `<div class="ds-line" style="color:var(--danger);"><span>ส่วนลดเพิ่มเติม</span><span>− ${fmt(disc)} บาท</span></div>` : ''}
    <div class="ds-final"><span>ราคาที่ลูกค้าจ่าย (ตัวอย่าง)</span><b>${fmt(final)} บาท</b></div>`;
}
function tierDiscountSimHtml(m){
  if(!(m.tiers && m.tiers.length)) return '';
  const disc = Number(discountSimTier[m.id]||0);
  return `
  <div class="discount-sim" onclick="event.stopPropagation();">
    <div class="ds-label">จำลองส่วนลดเพิ่มเติม (ลูกค้าเบอร์รายเดือน ทุกเรทโปร)</div>
    <div class="ds-row">
      <input id="ds-input-tier-${m.id}" type="number" min="0" placeholder="ใส่ส่วนลดเพิ่ม (บาท)" value="${disc||''}" oninput="applyDiscountSim('tier','${m.id}', this.value)">
      <button class="ds-clear" onclick="clearDiscountSim('tier','${m.id}')">Clear</button>
    </div>
    <div class="ds-breakdown" id="ds-breakdown-tier-${m.id}">${tierBreakdownHtml(m)}</div>
  </div>`;
}

function applyDiscountSim(kind, id, val){
  const n = Math.max(0, Number(val)||0);
  const m = models.find(x=>x.id===id);
  if(!m) return;
  if(kind==='cash'){
    discountSimCash[id] = n;
    const el = document.getElementById('ds-breakdown-cash-'+id);
    if(el) el.innerHTML = cashBreakdownHtml(m);
  } else {
    discountSimTier[id] = n;
    const el = document.getElementById('ds-breakdown-tier-'+id);
    if(el) el.innerHTML = tierBreakdownHtml(m);
  }
}
function clearDiscountSim(kind, id){
  const m = models.find(x=>x.id===id);
  if(!m) return;
  if(kind==='cash'){
    discountSimCash[id] = 0;
    const input = document.getElementById('ds-input-cash-'+id);
    if(input) input.value = '';
    const el = document.getElementById('ds-breakdown-cash-'+id);
    if(el) el.innerHTML = cashBreakdownHtml(m);
  } else {
    discountSimTier[id] = 0;
    const input = document.getElementById('ds-input-tier-'+id);
    if(input) input.value = '';
    const el = document.getElementById('ds-breakdown-tier-'+id);
    if(el) el.innerHTML = tierBreakdownHtml(m);
  }
}

function modelCardHtml(m){
  const info = modelStockInfo(m.id);
  const { codes, chips: codeChips } = codeChipsHtml(m);
  const spec = specLine(m);

  return `

/* ============ DRAG TO REORDER (press-and-hold on grip handle) ============ */
const HOLD_MS = 220; // how long to hold before drag activates (distinguishes from scroll/tap)
function initDragReorder(){
  const container = document.getElementById('view-manage');
  container.addEventListener('pointerdown', onDragHandlePointerDown);
}
function onDragHandlePointerDown(e){
  const handle = e.target.closest('.drag-handle');
  if(!handle || handle.classList.contains('disabled')) return;
  const item = handle.closest('.drag-item');
  if(!item) return;
  e.preventDefault();
  const pointerId = e.pointerId;
  const startY = e.clientY;
  let activated = false;

  const holdTimer = setTimeout(()=>{
    activated = true;
    item.classList.add('dragging');
    try{ handle.setPointerCapture(pointerId); }catch(_){}
  }, HOLD_MS);

  function onMove(ev){
    if(!activated){
      if(Math.abs(ev.clientY - startY) > 10){
        clearTimeout(holdTimer);
        cleanup();
      }
      return;
    }
    ev.preventDefault();
    const container2 = document.getElementById('view-manage');
    const items = Array.from(container2.querySelectorAll('.drag-item'));
    const y = ev.clientY;
    for(const other of items){
      if(other === item) continue;
      const rect = other.getBoundingClientRect();
      const middle = rect.top + rect.height/2;
      if(y < middle && other.previousElementSibling !== item){
        container2.insertBefore(item, other);
        break;
      } else if(y >= middle && other.nextElementSibling !== item){
        container2.insertBefore(item, other.nextElementSibling);
        break;
      }
    }
  }
  function onUp(){
    clearTimeout(holdTimer);
    if(activated){
      item.classList.remove('dragging');
      try{ handle.releasePointerCapture(pointerId); }catch(_){}
      finalizeReorder();
    }
    cleanup();
  }
  function cleanup(){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
  }
  window.addEventListener('pointermove', onMove, {passive:false});
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}
function finalizeReorder(){
  const idsInOrder = Array.from(document.querySelectorAll('#view-manage .drag-item')).map(el=>el.dataset.id);
  const updates = {};
  idsInOrder.forEach((id, i)=>{ updates[`models/${id}/sortIndex`] = i; });
  db.ref().update(updates);
  stampUpdated();
  toast('บันทึกลำดับใหม่แล้ว');
}

function deleteModel(id){
  const removedModel = models.find(x=>x.id===id);
  if(!removedModel) return;
  const removedStock = stock[id];
  db.ref('models/'+id).remove();
  db.ref('stock/'+id).remove();
  stampUpdated();
  showUndoToast(`ลบ "${removedModel.name}${specLine(removedModel)?' '+specLine(removedModel):''}" แล้ว`, ()=>{
    const {id:_id, ...rest} = removedModel;
    db.ref('models/'+id).set(rest);
    if(removedStock){
      const obj = {};
      removedStock.forEach(c=>{ const {code, ...r} = c; obj[code] = r; });
      db.ref('stock/'+id).set(obj);
    }
    stampUpdated();
    toast('เลิกทำแล้ว');
  });
}

function saveModel(){
  const name = document.getElementById('f-name').value.trim();
  const series = document.getElementById('f-series').value;
  const ramRaw = document.getElementById('f-ram').value.trim();
  const storageRaw = document.getElementById('f-storage').value.trim();
  const normal = Number(document.getElementById('f-normal').value)||0;
  const special = Number(document.getElementById('f-special').value)||0;
  if(!name){ toast('กรุณาใส่ชื่อรุ่น'); return; }
  const tiers = tierDraft.filter(t=>t.m!=='' && t.p!=='').map(t=>({m:Number(t.m),p:Number(t.p)})).sort((a,b)=>a.m-b.m);
  const isKit = !ramRaw && !!storageRaw;
  const data = isKit
    ? {name, series, ram:null, storage:null, isKit:true, kitLabel:storageRaw, normal, special, tiers}
    : {name, series, ram:ramRaw||null, storage:storageRaw||null, isKit:false, kitLabel:null, normal, special, tiers};
  if(editingModelId){
    db.ref('models/'+editingModelId).update(data);
  } else {
    const id = db.ref('models').push().key;
    const seriesModels = models.filter(m=>(m.series||'a')===series);
    const maxIdx = seriesModels.reduce((mx,m)=>Math.max(mx, m.sortIndex??0), -1);
    db.ref('models/'+id).set({...data, sortIndex: maxIdx+1});
  }
  closeModal();
  stampUpdated();
  toast('บันทึกรุ่นเรียบร้อย');
}

function changeQty(id, code, delta){
  const entry = (stock[id]||[]).find(c=>c.code===code);
  if(!entry) return;
  const oldQ = Number(entry.qty||0);
  const newQ = Math.max(0, oldQ + delta);
  const outSince = newQ===0 && oldQ>0 ? new Date().toISOString() : (newQ>0 ? null : entry.outSince);
  db.ref(`stock/${id}/${code}`).update({qty:newQ, outSince});
  stampUpdated();
}

function confirmColorSave(){
  const code = document.getElementById('f-code').value.trim();
  const color = document.getElementById('f-color').value.trim();
  const qty = Math.max(0, Number(document.getElementById('f-qty').value)||0);
  if(!/^\d{6}$/.test(code)){ toast('รหัสสินค้าต้องเป็นตัวเลข 6 หลัก'); return; }
  if(!color){ toast('กรุณาใส่ชื่อสี'); return; }

  // duplicate code check across all models/colors (excluding the entry currently being edited)
  const dup = findCodeOwner(code, stockModalModelId, editingColorCode);
  if(dup){
    const proceed = confirm(`รหัสสินค้า #${code} ถูกใช้แล้วกับ "${dup.modelName} · ${dup.color}" ต้องการบันทึกซ้ำหรือไม่?`);
    if(!proceed) return;
  }

  const oldCode = editingColorCode;
  const existingEntry = oldCode ? (stock[stockModalModelId]||[]).find(c=>c.code===oldCode) : null;
  const oldQ = existingEntry ? Number(existingEntry.qty||0) : 0;
  const outSince = qty===0
    ? (existingEntry && oldQ===0 ? existingEntry.outSince : new Date().toISOString())
    : null;

  if(oldCode && oldCode !== code){
    db.ref(`stock/${stockModalModelId}/${oldCode}`).remove();
  }
  db.ref(`stock/${stockModalModelId}/${code}`).set({color, qty, outSince});

  closeModal();
  stampUpdated();
  toast('บันทึกเรียบร้อย');
}
function findCodeOwner(code, excludeModelId, excludeCode){
  for(const modelId in stock){
    const arr = stock[modelId] || [];
    for(const entry of arr){
      if(modelId===excludeModelId && entry.code===excludeCode) continue;
      if(entry.code === code){
        const mm = models.find(x=>x.id===modelId);
        return { modelName: mm ? mm.name+' '+specLine(mm) : modelId, color: entry.color };
      }
    }
  }
  return null;
}

/* ============ OUT OF STOCK SUMMARY ============ */
function computeOosGroups(){
  let totalSkuOut = 0, totalModelsFullyOut = 0;
  const groups = [];
  models.forEach(m=>{
    const arr = stock[m.id]||[];
    const outEntries = arr.filter(c=>Number(c.qty||0)===0);
    if(outEntries.length===0) return;
    const info = modelStockInfo(m.id);
    if(info.out) totalModelsFullyOut++;
    totalSkuOut += outEntries.length;
    groups.push({model:m, outEntries, fullyOut:info.out});
  });
  const sorted = groups.slice().sort((a,b)=> (b.fullyOut - a.fullyOut));
  return { groups: sorted, totalSkuOut, totalModelsFullyOut };
}

function renderOosView(){

// Builds a plain-text version of the out-of-stock list, formatted for pasting
// straight into a LINE chat with colleagues.
function buildOosText(){
  const { groups, totalSkuOut, totalModelsFullyOut } = computeOosGroups();
  const dateStr = new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});
  if(groups.length===0){
    return `📋 รายการสินค้าหมดสต๊อก (${dateStr})\n\nไม่มีสินค้าหมดสต๊อกในขณะนี้ 🎉`;
  }
  let lines = [`📋 รายการสินค้าหมดสต๊อก (${dateStr})`, ''];
  groups.forEach(g=>{
    const tag = g.fullyOut ? ' [หมดทั้งรุ่น]' : '';
    lines.push(`${g.model.name}${specLine(g.model) ? ' ' + specLine(g.model) : ''}${tag}`);
    g.outEntries.forEach(c=>{
      lines.push(`- ${c.color} #${c.code} (${daysOutText(c.outSince)})`);
    });
    lines.push('');
  });
  lines.push(`รวม ${totalSkuOut} รายการ จาก ${groups.length} รุ่น (${totalModelsFullyOut} รุ่นหมดทั้งหมด)`);
  return lines.join('\n');
}

async function copyOosList(){
  const text = buildOosText();
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else {
      throw new Error('clipboard api unavailable');
    }
    toast('คัดลอกรายการแล้ว — ไปวางในไลน์ได้เลย');
  }catch(err){
    // fallback for older/in-app browsers without Clipboard API permission
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('คัดลอกรายการแล้ว — ไปวางในไลน์ได้เลย');
    }catch(err2){
      toast('คัดลอกไม่สำเร็จ ลองแตะค้างที่ข้อความแล้วคัดลอกเองแทน');
    }
  }
}

/* ============ AUTH LOGIC ============ */
async function hashText(text){
  try{
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(err){
    // fallback for environments without a secure-context Web Crypto API
    let h = 0;
    for(let i=0;i<text.length;i++){ h = ((h<<5)-h + text.charCodeAt(i))|0; }
    return 'fb' + Math.abs(h).toString(16);
  }
}
function hasAuthSetup(){ return !!localStorage.getItem(AUTH_KEY); }
function isSessionValid(){
  const until = Number(localStorage.getItem(SESSION_KEY) || 0);
  return Date.now() < until;
}
function startSession(){ localStorage.setItem(SESSION_KEY, String(Date.now() + SESSION_MS)); }
function clearSession(){ localStorage.removeItem(SESSION_KEY); }

function unlockApp(){
  document.body.classList.remove('locked');
  document.getElementById('lockScreen').style.display = 'none';
}
function lockApp(){
  clearSession();
  document.body.classList.add('locked');
  renderLockScreen();
}

async function initAuth(){
  if(!hasAuthSetup()){
    localStorage.setItem(AUTH_KEY, await hashText(DEFAULT_PASSCODE));
  }
  if(isSessionValid()){
    unlockApp();
    return;
  }
  renderLockScreen();
}

function renderLockScreen(){
  const el = document.getElementById('lockScreen');
  el.innerHTML = `
    <div class="lock-card" id="lockCard">
      <div class="lock-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <h1>Project <span>ORBIT</span></h1>
      <div class="lock-sub">ใส่รหัสผ่านเพื่อเข้าใช้งาน</div>
      <input id="unlockPass" type="password" placeholder="รหัสผ่าน" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="lock-btn" onclick="submitUnlock()">เข้าใช้งาน</button>
      <div class="lock-err" id="lockErr"></div>
      <div class="lock-foot">ต้องใส่รหัสผ่านใหม่ทุก 24 ชั่วโมงเพื่อความปลอดภัยของข้อมูลร้าน</div>
    </div>`;
  const input = document.getElementById('unlockPass');
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submitUnlock(); });
  setTimeout(()=>input.focus(), 50);
}
async function submitUnlock(){
  const val = document.getElementById('unlockPass').value;
  const err = document.getElementById('lockErr');
  const stored = localStorage.getItem(AUTH_KEY);
  const hashed = await hashText(val);
  if(hashed === stored){
    startSession();
    unlockApp();
  } else {
    err.textContent = 'รหัสผ่านไม่ถูกต้อง';
    shakeLock();
  }
}
function shakeLock(){
  const card = document.getElementById('lockCard');
  if(!card) return;
  card.classList.remove('shake');
  void card.offsetWidth; // restart animation
  card.classList.add('shake');
}

function openChangePasscodeModal(){
  const html = `
    <div class="modal-handle"></div>
    <h2>รหัสผ่าน / ล็อกแอป</h2>
    <div class="field"><label>รหัสผ่านปัจจุบัน</label><input id="cp-current" type="password" placeholder="รหัสผ่านปัจจุบัน" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>รหัสผ่านใหม่</label><input id="cp-new1" type="password" placeholder="อย่างน้อย 4 ตัวอักษร" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>ยืนยันรหัสผ่านใหม่</label><input id="cp-new2" type="password" placeholder="พิมพ์ซ้ำอีกครั้ง" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="lock-err" id="cpErr" style="text-align:left;"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">ยกเลิก</button>
      <button class="btn primary" onclick="submitChangePasscode()">เปลี่ยนรหัสผ่าน</button>
    </div>
    <button class="btn danger" style="width:100%;margin-top:10px;" onclick="closeModal();lockApp();">🔒 ล็อกแอปตอนนี้</button>

}
async function submitChangePasscode(){
  const current = document.getElementById('cp-current').value;
  const p1 = document.getElementById('cp-new1').value;
  const p2 = document.getElementById('cp-new2').value;
  const err = document.getElementById('cpErr');
  const stored = localStorage.getItem(AUTH_KEY);
  if(await hashText(current) !== stored){ err.textContent = 'รหัสผ่านปัจจุบันไม่ถูกต้อง'; return; }
  if(p1.length < 4){ err.textContent = 'รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร'; return; }
  if(p1 !== p2){ err.textContent = 'รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน'; return; }
  localStorage.setItem(AUTH_KEY, await hashText(p1));
  closeModal();
  toast('เปลี่ยนรหัสผ่านเรียบร้อย');
}

/* ============ FIREBASE SYNC ============ */
// Seeds the default catalog into Firebase exactly once — only if the database
// is completely empty (a brand-new project). After that, every device reads
// and writes live through the listeners below; DEFAULT_MODELS is never touched
// again.
async function seedIfEmpty(){
  const snap = await db.ref('models').once('value');
  if(snap.exists()) return;
  const seed = {};
  DEFAULT_MODELS.forEach((m, i)=>{
    const {id, ...rest} = m;
    seed[id] = {...rest, sortIndex:i};
  });
  await db.ref('models').set(seed);
}

function attachRealtimeListeners(){
  db.ref('models').on('value', snap=>{
    const val = snap.val() || {};
    models = Object.keys(val).map(id=>({id, ...val[id]}));
    models.sort((a,b)=>(a.sortIndex??0)-(b.sortIndex??0));
    renderAll();
  });
  db.ref('stock').on('value', snap=>{
    const val = snap.val() || {};
    const newStock = {};
    Object.keys(val).forEach(modelId=>{
      const colors = val[modelId] || {};
      newStock[modelId] = Object.keys(colors).map(code=>({code, ...colors[code]}));
    });
    stock = newStock;
    renderAll();
  });
  db.ref('meta/lastUpdated').on('value', snap=> renderLastUpdated(snap.val()));
}

/* ============ INIT ============ */
seedIfEmpty().then(attachRealtimeListeners).catch(err=>{
  console.error('Firebase init error:', err);
  toast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
  attachRealtimeListeners(); // still attach listeners so it recovers once connection returns
});
initDragReorder();
initAuth();
